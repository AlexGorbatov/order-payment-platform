# The demo checkout page and a reverse proxy to the two services, so the browser talks to one origin and the services
# need no CORS configuration. The token is the user's own; nginx only forwards it.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /config.json {
        add_header Cache-Control "no-store";
    }

    location /order-api/ {
        proxy_pass http://order-service:8081/;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }

    location /payment-api/ {
        proxy_pass http://payment-service:8082/;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }
}
