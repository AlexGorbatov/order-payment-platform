server:
  port: 8082

spring:
  application:
    name: payment-service
  datasource:
    url: ${PAYMENTS_DB_URL:jdbc:postgresql://localhost:5432/payments_db}
    username: ${PAYMENTS_DB_USER:payments}
    password: ${PAYMENTS_DB_PASSWORD:payments}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  jackson:
    deserialization:
      accept-float-as-int: false
    mapper:
      allow-coercion-of-scalars: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  flyway:
    # service migrations first, then the ones the platform starters ship (V1000+)
    locations: classpath:db/migration,classpath:db/migration/platform
  security:
    oauth2:
      resourceserver:
        jwt:
          # must equal the `iss` of the tokens; the realm is imported by infra/keycloak/realm-opp.json
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/opp}
          # where to fetch the signing keys; defaults to <issuer>/protocol/openid-connect/certs
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:}

opp:
  security:
    audience: payment-service

platform:
  dead-letters:
    persister:
      # Dead letters of the topic this service consumes, and only those: both services share the broker, and the starter's
      # default (.*-dlt) would store the other service's dead letters in this database as well (architecture §7.4).
      topic-pattern: 'order\.events\.v1-dlt'
  test-support:
    # POST /api/v1/test-support/**: confirms PaymentIntents with Stripe test payment methods. Off unless the `local` or
    # `stripe-test` profile turns it on; with the flag off the endpoint does not exist.
    enabled: false

payment:
  initiation:
    # the PaymentInitiationWorker (architecture §6.1): creates the PaymentIntent of payments waiting in CREATED
    enabled: true
    interval: 2s
    batch-size: 10
    lease: 5m
    # Stripe forgets idempotency keys after at least 24 h; a payment older than this is failed, not retried (F08)
    idempotency-window: 23h
  cancellation:
    # the PaymentCancellationWorker (architecture §6.4): cancels the PaymentIntent of cancelled orders
    enabled: true
    interval: 2s
  refund:
    # the RefundWorker (architecture §6.5): creates the requested refunds at Stripe
    enabled: true
    interval: 2s
  reconciliation:
    # ReconciliationJob (architecture §8.4): checks quiet, unfinished payments against Stripe (lost webhooks, F11)
    enabled: true
    interval: 5m
    stale-after: 10m
    rate-limit-per-second: 5
  webhook-processor:
    # the WebhookProcessor (architecture §6.6): applies stored Stripe webhooks; DEAD after max attempts (F14)
    enabled: true
    interval: 1s
    batch-size: 50
    retry-max-attempts: 8

# Stripe (architecture §8, ADR-0012). Only TEST-mode keys are accepted; the application refuses to start otherwise.
stripe:
  api-key: ${STRIPE_API_KEY:}
  # stripe-mock for `local`; empty means the real Stripe API
  api-base: ${STRIPE_API_BASE:}
  connect-timeout: 5s
  read-timeout: 15s
  max-network-retries: 2
  webhook:
    # comma-separated: two secrets while one is rolled. Empty: every webhook is refused.
    signing-secrets: ${STRIPE_WEBHOOK_SECRET:}
    tolerance: 300s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
