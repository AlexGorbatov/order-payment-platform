# Local development: a short payment window, and the OpenAPI document (/v3/api-docs) and Swagger UI
# (/swagger-ui.html).
order:
  payment-timeout: PT3M

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    # "Authorize" in Swagger UI takes a token from ./scripts/token.sh customer1
    persist-authorization: true
