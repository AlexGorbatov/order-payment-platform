name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and verify
        run: ./mvnw -B -ntp verify

      - name: Upload JaCoCo reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-reports
          path: '**/target/site/jacoco/'
          if-no-files-found: ignore

      # The end-to-end job runs the very jars that were just verified; it does not build them again.
      - name: Upload service jars
        uses: actions/upload-artifact@v4
        with:
          name: service-jars
          path: |
            services/order-service/target/order-service-*-SNAPSHOT.jar
            services/payment-service/target/payment-service-*-SNAPSHOT.jar
          if-no-files-found: error
          retention-days: 2

  # Both services as processes against PostgreSQL, Kafka, Keycloak and a Stripe double (docs/testing.md). Separate from
  # `build` because it takes minutes and needs the jars, not the sources; a hung environment ends at the timeouts, not
  # at the six hours GitHub allows.
  e2e:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Download service jars
        uses: actions/download-artifact@v4
        with:
          name: service-jars
          path: services

      - name: Check the jars
        run: ls -l services/order-service/target/*.jar services/payment-service/target/*.jar

      # -am builds event-contracts (the scenarios use its envelope), which is quick; the services are not rebuilt.
      - name: Run end-to-end scenarios
        run: ./mvnw -B -ntp -pl e2e-tests -am -Pe2e verify

      - name: Upload service logs and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: |
            e2e-tests/target/e2e-logs/
            e2e-tests/target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 7

  # The demo images (compose profile `apps`) must keep building, and the compose files must stay valid.
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate the compose files
        run: |
          docker compose -f infra/docker-compose.yml --profile apps --profile stripe-test --profile observability config -q
          STRIPE_API_KEY=sk_test_ci STRIPE_WEBHOOK_SECRET=whsec_ci \
            docker compose -f infra/docker-compose.yml -f infra/docker-compose.stripe-test.yml \
            --profile apps --profile stripe-test config -q

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # The layer cache (GitHub Actions cache) is shared by both targets and by later runs; the root .dockerignore keeps docs
      # and scripts out of the context, so a change that touches no build input reuses every layer.
      - name: Build the order-service image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile
          target: order-service
          push: false
          cache-from: type=gha,scope=images
          cache-to: type=gha,scope=images,mode=max

      - name: Build the payment-service image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile
          target: payment-service
          push: false
          cache-from: type=gha,scope=images
          cache-to: type=gha,scope=images,mode=max

  # Publishes the coverage number for the README badge: the JaCoCo reports of `build`, reduced to a shields.io endpoint
  # file on the `badges` branch (kept apart from the code). Only for pushes to main, and the only job that may write.
  badges:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download the coverage reports
        uses: actions/download-artifact@v4
        with:
          name: jacoco-reports
          path: reports

      - name: Compute the badge
        run: .github/scripts/coverage-badge.sh reports > coverage.json

      - name: Publish it on the badges branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir badges && cd badges
          git init -q -b badges
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # Continue from the branch if it exists. A failed fetch must fail the job: carrying on would push a root
          # commit that is rejected as non-fast-forward.
          if git ls-remote --exit-code --heads origin badges > /dev/null; then
            git fetch -q --depth=1 origin badges
            git reset -q --hard FETCH_HEAD
          fi
          cp ../coverage.json coverage.json
          git add coverage.json
          if git diff --cached --quiet; then
            echo "badge unchanged"
          else
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -q -m "Update coverage badge for ${GITHUB_SHA::7}"
            git push -q origin badges
          fi
