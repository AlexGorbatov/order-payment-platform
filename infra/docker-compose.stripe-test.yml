# Overlay for `--profile apps --profile stripe-test`: payment-service talks to the real Stripe API (test mode) and the
# Stripe CLI forwards Stripe's webhooks to it inside the compose network.
#
#   ./scripts/up.sh --apps --stripe-test        # does all of this, and checks the keys first
#   docker compose -f infra/docker-compose.yml -f infra/docker-compose.stripe-test.yml --env-file .env \
#       --profile apps --profile stripe-test up -d --build --wait
#
# Needs in .env (or the environment): STRIPE_API_KEY=sk_test_... and STRIPE_WEBHOOK_SECRET=whsec_... (the secret of
# `stripe listen`, see docs/demo.md). Live keys are refused by LiveModeGuard at startup.

services:
  payment-service:
    environment:
      SPRING_PROFILES_ACTIVE: stripe-test
      STRIPE_API_KEY: ${STRIPE_API_KEY}
      # empty = the real Stripe API
      STRIPE_API_BASE: ""
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}

  web:
    environment:
      # the real Stripe Payment Element; Stripe's webhooks come through the Stripe CLI, so the interface sends none
      WEB_PAYMENT_ELEMENT: "true"
      WEB_SIMULATE_WEBHOOKS: "false"

  stripe-cli:
    # Only what the platform handles (architecture §8.3); everything else would just be logged as ignored.
    command:
      - listen
      - --forward-to
      - http://payment-service:8082/webhooks/stripe
      - --events
      - payment_intent.processing,payment_intent.requires_action,payment_intent.payment_failed,payment_intent.succeeded,payment_intent.canceled,charge.refunded,refund.failed,charge.dispute.created
    depends_on:
      payment-service:
        condition: service_healthy
