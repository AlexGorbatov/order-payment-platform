# Stub: scrapes only the observability stack itself. Service targets and alert rules are not included.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  # Service targets (on the host, or in the `apps` profile) would go here:
  # - job_name: order-service
  #   metrics_path: /actuator/prometheus
  #   static_configs:
  #     - targets: ["host.docker.internal:8081"]
  # - job_name: payment-service
  #   metrics_path: /actuator/prometheus
  #   static_configs:
  #     - targets: ["host.docker.internal:8082"]
